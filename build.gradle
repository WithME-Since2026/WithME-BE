plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'yooze'
version = '0.0.1-SNAPSHOT'
description = 'WithME'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 배포 헬스체크(/actuator/health). 빠지면 컨테이너가 영구 unhealthy 로 판정되어 배포가 롤백된다.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Micrometer -> /actuator/prometheus. Actuator 가 이미 있어 추가 비용은 사실상 없다.
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Spring Boot 4.1부터 RestClient.Builder 자동설정이 starter-web에서 분리됨 (KakaoAuthClient에서 사용)
    implementation 'org.springframework.boot:spring-boot-starter-restclient'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'

    // Mail
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Flyway (partial unique index 등 JPA로 표현 불가한 스키마 관리)
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Swagger (Spring Boot 4.x 호환)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Boot 4 부터 MockMvc 는 starter-test 에 딸려오지 않는다.
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // CI 테스트용 인메모리 DB. 빠지면 테스트가 실제 PostgreSQL 을 요구하게 된다.
    testRuntimeOnly 'com.h2database:h2'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

// plain jar 를 만들지 않는다.
// bootJar 와 함께 build/libs 에 두 개가 생기면 Dockerfile 의 COPY glob 이
// 소스 2개를 잡아 이미지 빌드가 실패한다.
tasks.named('jar') {
    enabled = false
}
