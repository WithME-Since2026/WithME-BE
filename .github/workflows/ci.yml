name: CI

on:
  pull_request:
    branches: [ main, develop ]

# 워크플로 전체 기본 권한을 최소로 고정한다.
permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    # 소스 체크아웃 외에는 아무 권한도 필요하지 않다.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Create Firebase service account key
        run: |
          mkdir -p src/main/resources/firebase
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > src/main/resources/firebase/service-account-key.json

      # 테스트는 src/test/resources/application.yml의 H2 인메모리 DB를 사용하므로
      # 별도의 DB 서비스 컨테이너나 시크릿이 필요하지 않다.
      - name: Build & Test
        run: ./gradlew build --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
