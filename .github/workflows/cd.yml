name: CD

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

# 워크플로 전체 기본 권한을 최소로 고정하고, 필요한 잡에서만 넓힌다.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read   # 소스 체크아웃
      packages: write  # GHCR 이미지 푸시
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 테스트는 CI(PR)에서 이미 검증되었으므로 여기서는 패키징만 수행
      - name: Build bootJar
        run: ./gradlew clean bootJar -x test --no-daemon

      # GHCR은 소문자 경로만 허용하므로 owner/repo를 소문자로 변환
      - name: Resolve image name
        id: meta
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # SHA 태그는 롤백 지점으로 남겨야 하므로 매 배포마다 고유하게 유지한다.
      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    # 배포는 한 번에 하나만 진행한다.
    # cancel-in-progress 를 켜면 .env 교체와 헬스체크 사이에서 중단되어
    # 롤백도 못 한 채 서버가 어중간한 상태로 남을 수 있으므로 반드시 false 로 두고 대기시킨다.
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false
    permissions:
      contents: read   # 소스 체크아웃 (compose 파일, 배포 스크립트)
      packages: read   # EC2에서 GHCR 이미지 pull 시 사용할 토큰

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy deploy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,scripts/deploy.sh"
          target: /home/${{ secrets.EC2_USER }}/withme

      # 새 설정은 .env.new 로 전달하고, 기존 .env 는 deploy.sh 가
      # .env.rollback 으로 보관한다. 검증 실패 시 이 파일로 되돌린다.
      - name: Deploy with health check and rollback
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE
          script_stop: true
          command_timeout: 15m
          script: |
            cd ~/withme

            cat > .env.new <<EOF
            APP_IMAGE=${IMAGE}:${{ github.sha }}
            DDL_AUTO=${{ vars.DDL_AUTO || 'validate' }}
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            EOF
            chmod 600 .env.new

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            chmod +x scripts/deploy.sh
            bash scripts/deploy.sh
