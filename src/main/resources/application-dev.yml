spring:
  # 로컬은 Hibernate 가 스키마를 만든다.
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # Flyway 는 Hibernate 보다 먼저 실행되므로, 빈 로컬 DB 에서 켜두면
  # V1 이 아직 없는 user_token 테이블을 참조해 기동이 실패한다.
  # 마이그레이션을 로컬에서 검증하려면 ddl-auto 로 테이블을 만든 뒤
  # FLYWAY_ENABLED=true 로 다시 띄운다.
  flyway:
    enabled: ${FLYWAY_ENABLED:false}

logging:
  level:
    yooze.withme: debug
    org.hibernate.orm.jdbc.bind: trace
