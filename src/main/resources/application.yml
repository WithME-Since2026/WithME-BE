spring:
  application:
    name: WithME
  # 프로필을 지정하지 않고 실행하면 로컬 개발용(dev) 설정을 사용
  profiles:
    default: dev

  # DB_URL 은 항상 완전한 JDBC URL
  # develop 의 `jdbc:postgresql://localhost:5432/${DB_URL}` 형태는 호스트가 localhost 로
  # 고정되어 별도 PostgreSQL 인스턴스를 가리킬 수 없으므로, 병합 시 이 형태로 통일한다.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # 컨테이너 안에서 localhost 는 앱 자신을 가리키므로 기본값에 의존하면 안 된다.
  # compose 가 REDIS_HOST=redis 를 주입한다.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  flyway:
    # 스키마가 없는 최초 배포에서는 꺼야 한다. docs/DEPLOYMENT.md 참고.
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    # 기본값 1 을 쓰면 baseline 이 V1 을 "이미 적용됨"으로 표시해 V1 이 영영 실행되지 않는다.
    baseline-version: 0
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true

# 배포 검증용 헬스체크 엔드포인트. health 외에는 노출X
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
