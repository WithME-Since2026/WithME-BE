spring:
  application:
    name: WithME
  # 프로필을 지정하지 않고 실행하면 로컬 개발용(dev) 설정을 사용
  profiles:
    default: dev

  # DB_URL 은 항상 완전한 JDBC URL
  # `jdbc:postgresql://localhost:5432/${DB_URL}` 형태는 호스트가 localhost 로
  # 고정되어 별도 PostgreSQL 인스턴스를 가리킬 수 없으므로 이 형태로 통일한다.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # 컨테이너 안에서 localhost 는 앱 자신을 가리키므로 기본값에 의존하면 안 된다.
  # compose 가 REDIS_HOST=redis 를 주입한다.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  flyway:
    # 스키마가 없는 최초 배포에서는 꺼야 한다. docs/DEPLOYMENT.md 참고.
    enabled: ${FLYWAY_ENABLED:true}
    # 기존 스키마(JPA ddl-auto 생성)가 있을 때 Flyway 첫 실행 허용
    baseline-on-migrate: true
    # 기본값 1 을 쓰면 baseline 이 V1 을 "이미 적용됨"으로 표시해 V1 이 영영 실행되지 않는다.
    baseline-version: 0
    locations: classpath:db/migration

  # 종료 신호를 받으면 처리 중인 요청이 끝날 때까지 최대 20초 기다린다.
  # docker-compose 의 stop_grace_period 보다 반드시 짧아야 한다.
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # ddl-auto 와 show-sql 은 프로필별로 지정한다 (dev: update/true, prod: validate/false)
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        globally_quoted_identifiers: true

# 기본값은 immediate 라 종료 시 처리 중인 요청이 그냥 끊긴다.
server:
  shutdown: graceful

# 5xx 발생 시 Discord 채널로 알림.
# url 은 그 자체가 인증 수단이므로 환경변수로만 주입
discord:
  webhook:
    url: ${DISCORD_WEBHOOK_URL:}
    enabled: ${DISCORD_WEBHOOK_ENABLED:false}
    # 장애 시 같은 에러가 초당 수백 건 나므로 종류별로 이 간격 안에서는 1건만 전송
    cooldown: 5m

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000      # 30분 (ms)
  refresh-token-expiration: 1209600000  # 14일 (ms)


# 카카오
kakao:
  client-id: ${KAKAO_CLIENT_ID}
  # 카카오 로그인 보안 강화(선택) 설정을 켰다면 필수, 아니면 비워둬도 됨
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI}

# 배포 검증용 헬스체크 + 지표 수집 엔드포인트. 그 외에는 노출X
# ponytail: 관리 포트 분리는 실제 스크래퍼가 붙을 때. 지금은 인증만으로 충분하다.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
