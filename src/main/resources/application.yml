spring:
  application:
    name: WithME

  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # 운영 기본값. 개발 시 application-dev.yml에서 update로 오버라이드
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false        # 운영 기본값. 개발 시 application-dev.yml에서 true로 오버라이드

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000      # 30분 (ms)
  refresh-token-expiration: 1209600000  # 14일 (ms)