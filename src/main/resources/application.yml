spring:
  application:
    name: WithME
  # 프로필을 지정하지 않고 실행하면 로컬 개발용(dev) 설정을 사용
  profiles:
    default: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true

# 배포 검증용 헬스체크 엔드포인트. health 외에는 노출X
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
