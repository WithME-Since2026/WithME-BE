spring:
  application:
    name: WithME
  # 테스트는 dev/prod 어느 쪽에도 의존하지 않고 H2 인메모리 DB만 사용
  profiles:
    default: test
  datasource:
    url: jdbc:h2:mem:withme;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true
    show-sql: true

  # 마이그레이션이 PostgreSQL 전용 문법(partial unique index)을 쓰므로 H2 에서는 실행할 수 없다.
  # 테스트 스키마는 Hibernate 의 create-drop 으로 만든다.
  flyway:
    enabled: false

  # 실제 Redis 없이도 컨텍스트가 뜨도록 연결은 lazy 상태로 둔다.
  # Redis 연동 자체를 검증하려면 Testcontainers 가 필요하다.
  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: smtp.gmail.com
    port: 587
    username: test@example.com
    password: dummy_password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# 테스트 전용 더미 값. 운영 시크릿과 무관하다.
jwt:
  secret: test-only-secret-key-for-context-loading-not-used-in-production
  access-token-expiration: 1800000
  refresh-token-expiration: 1209600000

firebase:
  service-account-key-path: firebase/service-account-key.json

kakao:
  client-id: dummy-kakao-client-id
  client-secret: dummy-kakao-client-secret
  redirect-uri: http://localhost:8080/api/v1/auth/kakao/callback
